<main class="sim-dashboard">
  <h1>Garage SimSetupManager</h1>
  <div *ngIf="setups.length === 0">Chargement des réglages...</div>

  <div class="setup-card" *ngFor="let setup of setups">
    <h2>Setup ID: {{ setup.id | slice:0:8 }}...</h2>
    
  <div class="telemetry-panel" *ngIf="setup.settings?.suspension">
  <app-touch-slider 
    label="Hauteur de caisse AV (mm)" 
    [min]="50" 
    [max]="150" 
    [(value)]="setup.settings.suspension.frontRideHeight">
  </app-touch-slider>
</div>
  </div>
</main>
